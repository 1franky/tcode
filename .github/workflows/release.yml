name: Release

# Se dispara al empujar un tag "v*.*.*" a main (ej. v0.1.0) — no en cada
# push. Compila tcode para Linux (x86_64 y ARM64), macOS (Intel y Apple
# Silicon) y Windows, y publica los binarios como un GitHub Release
# (PLAN.md §10, §11 M5).
#
# Firma de binarios (macOS notarización, Authenticode de Windows) queda
# pendiente: requiere certificados de pago que el proyecto no tiene
# todavía. En macOS sin firmar, Gatekeeper bloquea la primera ejecución —
# install/linux.sh documenta el `xattr -d com.apple.quarantine` necesario.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  compilar:
    name: Compilar (${{ matrix.nombre }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: linux-x86_64
            # Target musl, no gnu: produce un binario ESTÁTICO (libc
            # incluida adentro) sin ninguna dependencia de la versión de
            # glibc del sistema donde se instale. Un binario gnu enlazado
            # dinámicamente solo corre en sistemas con una glibc igual o
            # más nueva que la usada para compilarlo — probamos fijar el
            # runner a ubuntu-22.04 (glibc 2.35) como primer intento tras
            # un reporte de "GLIBC_2.39 not found" en una VPS, pero otro
            # reporte confirmó una VPS con glibc todavía más vieja
            # (< 2.32): no hay ninguna versión de glibc del runner que
            # sirva para todo el universo de VPS/distros posibles, así
            # que la única forma de eliminar esta clase de bug de raíz es
            # no depender de glibc en absoluto. `musl-tools` (paso de
            # abajo) alcanza para compilar nativo sin necesitar Docker.
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - nombre: linux-arm64
            # Cubre VPS ARM (AWS Graviton, Oracle Ampere, Raspberry Pi de
            # 64 bits). Musl por el mismo motivo que linux-x86_64, arriba
            # — estático, sin depender de la glibc del sistema destino.
            # Se compila con `cross` (Docker) en vez de `cargo build`
            # directo: a diferencia del target gnu (que tiene
            # `gcc-aarch64-linux-gnu` como paquete apt listo), no hay un
            # compilador cruzado aarch64-musl empaquetado para apt —
            # `cross` trae su propia imagen con todo el toolchain
            # necesario, incluido el de C que hace falta para compilar
            # las gramáticas de tree-sitter.
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - nombre: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - nombre: macos-x86_64
            # No hay runner Intel gratuito para repos públicos: se
            # compila cruzado desde Apple Silicon (el toolchain de Xcode
            # trae las librerías de sistema para ambas arquitecturas).
            os: macos-latest
            target: x86_64-apple-darwin
          - nombre: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar musl-tools (Linux x86_64 nativo, target musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: "Instalar `cross` (Linux ARM64: compilación cruzada vía Docker)"
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked

      - name: Compilar en modo release (nativo — todos los targets salvo ARM64 Linux)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # El tag que disparó este workflow (ej. "v0.4.1"), leído en
          # tiempo de compilación vía `option_env!` para que `tcode
          # --version` reporte la versión real instalada — ver
          # `crates/app/src/main.rs`. Sin efecto en un `cargo build`
          # local (la variable no existe), donde cae al valor de
          # respaldo "-dev".
          TCODE_VERSION: ${{ github.ref_name }}

      - name: Compilar en modo release (cruzado con `cross`, Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        # `cross` es un reemplazo directo de `cargo build`: deja el
        # binario en la misma ruta `target/<target>/release/`, así que
        # el paso de empaquetado de abajo no necesita saber cuál de los
        # dos se usó.
        run: cross build --release --target ${{ matrix.target }}
        env:
          TCODE_VERSION: ${{ github.ref_name }}

      - name: Empaquetar (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/tcode-${{ matrix.nombre }}.tar.gz" tcode

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/tcode.exe -DestinationPath tcode-${{ matrix.nombre }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tcode-${{ matrix.nombre }}
          path: tcode-${{ matrix.nombre }}.*
          if-no-files-found: error

  publicar:
    name: Publicar release
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Crear el GitHub Release con los binarios adjuntos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artefactos/* \
            --repo "${{ github.repository }}" \
            --title "tcode ${{ github.ref_name }}" \
            --generate-notes

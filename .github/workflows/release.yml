name: Release

# Se dispara al empujar un tag "v*.*.*" a main (ej. v0.1.0) — no en cada
# push. Compila tcode para Linux (x86_64 y ARM64), macOS (Intel y Apple
# Silicon) y Windows, y publica los binarios como un GitHub Release
# (PLAN.md §10, §11 M5).
#
# Firma de binarios (macOS notarización, Authenticode de Windows) queda
# pendiente: requiere certificados de pago que el proyecto no tiene
# todavía. En macOS sin firmar, Gatekeeper bloquea la primera ejecución —
# install/linux.sh documenta el `xattr -d com.apple.quarantine` necesario.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  compilar:
    name: Compilar (${{ matrix.nombre }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - nombre: linux-arm64
            # Sin runner ARM64 gratuito para repos públicos todavía en
            # este proyecto: se compila cruzado desde un runner x86_64
            # (ver el paso "Instalar el compilador cruzado" más abajo).
            # Cubre VPS ARM (AWS Graviton, Oracle Ampere, Raspberry Pi de
            # 64 bits) — reportado como faltante al intentar instalar en
            # uno de esos.
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - nombre: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - nombre: macos-x86_64
            # No hay runner Intel gratuito para repos públicos: se
            # compila cruzado desde Apple Silicon (el toolchain de Xcode
            # trae las librerías de sistema para ambas arquitecturas).
            os: macos-latest
            target: x86_64-apple-darwin
          - nombre: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar el compilador cruzado (Linux ARM64 en runner x86_64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Compilar en modo release
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # Sin efecto en los demás targets — cargo solo consulta la
          # variable del target que está compilando en este paso. Hace
          # falta tanto para el linker final como para el compilador C
          # que usa `cc-rs` al compilar las gramáticas de tree-sitter
          # (son código C, no Rust — necesitan su propio cruce).
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

      - name: Empaquetar (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/tcode-${{ matrix.nombre }}.tar.gz" tcode

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/tcode.exe -DestinationPath tcode-${{ matrix.nombre }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tcode-${{ matrix.nombre }}
          path: tcode-${{ matrix.nombre }}.*
          if-no-files-found: error

  publicar:
    name: Publicar release
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Crear el GitHub Release con los binarios adjuntos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artefactos/* \
            --repo "${{ github.repository }}" \
            --title "tcode ${{ github.ref_name }}" \
            --generate-notes

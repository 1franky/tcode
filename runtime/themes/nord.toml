# Tema Nord — paleta fría inspirada en el ártico (https://www.nordtheme.com,
# PLAN.md §7, #4).
name = "Nord"
type = "dark"

[ui]
background         = "#2e3440"
foreground         = "#d8dee9"
cursor             = "#d8dee9"
selection          = "#434c5e"
line_number        = "#4c566a"
line_number_active = "#d8dee9"
current_line       = "#3b4252"

[statusbar]
background     = "#242933"
foreground     = "#d8dee9"
modo_insertar  = "#a3be8c"
modo_seleccion = "#ebcb8b"

[syntax]
keyword  = { fg = "#81a1c1", style = "bold" }
string   = "#a3be8c"
number   = "#b48ead"
comment  = { fg = "#4c566a", style = "italic" }
function = "#88c0d0"
type     = "#8fbcbb"
variable = "#d8dee9"
constant = "#b48ead"
operator = "#81a1c1"

[diagnostics]
error   = "#bf616a"
warning = "#ebcb8b"
info    = "#88c0d0"
hint    = "#8fbcbb"

[git]
added    = "#a3be8c"
modified = "#ebcb8b"
deleted  = "#bf616a"

[search]
coincidencia_actual = "#d08770"
otras_coincidencias  = "#434c5e"

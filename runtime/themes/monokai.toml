# Tema Monokai — paleta clásica de Sublime Text/TextMate (PLAN.md §7, #2).
name = "Monokai"
type = "dark"

[ui]
background         = "#272822"
foreground         = "#f8f8f2"
cursor             = "#f8f8f0"
selection          = "#49483e"
line_number        = "#75715e"
line_number_active = "#f8f8f2"
current_line       = "#3e3d32"

[statusbar]
background     = "#1e1f1c"
foreground     = "#f8f8f2"
modo_insertar  = "#a6e22e"
modo_seleccion = "#e6db74"

[syntax]
keyword  = { fg = "#f92672", style = "bold" }
string   = "#e6db74"
number   = "#ae81ff"
comment  = { fg = "#75715e", style = "italic" }
function = "#a6e22e"
type     = "#66d9ef"
variable = "#f8f8f2"
constant = "#ae81ff"
operator = "#f92672"

[diagnostics]
error   = "#f92672"
warning = "#e6db74"
info    = "#66d9ef"
hint    = "#75715e"

[git]
added    = "#a6e22e"
modified = "#e6db74"
deleted  = "#f92672"

[search]
coincidencia_actual = "#fd971f"
otras_coincidencias  = "#49483e"

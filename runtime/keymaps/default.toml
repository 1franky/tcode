# Atajos por defecto de tcode (PLAN.md §4). Editable copiando este archivo
# a ~/.config/tcode/keymap.toml (o el equivalente de tu SO) y recargable en
# caliente con Ctrl+K Ctrl+L, sin reiniciar el editor.
#
# [global], [editor], [markdown] y [csv] se combinan todos en un único
# conjunto de atajos activos (no hay todavía un concepto de "ámbito
# activo" — el comando mismo decide si aplica al archivo actual).

[global]
"Ctrl+S"        = "archivo.guardar"
"Ctrl+Shift+S"  = "archivo.guardar_como"
# Alternativa: mismo problema de siempre con Ctrl+Shift+<letra> en
# terminales sin protocolo Kitty (confirmado repetidas veces en tmux a lo
# largo de este proyecto) — chord con Ctrl+K, sin esa ambigüedad.
"Ctrl+K S"      = "archivo.guardar_como"
"Ctrl+Q"        = "app.salir"
"Ctrl+Z"        = "editor.deshacer"
"Ctrl+Y"        = "editor.rehacer"
"Up"            = "cursor.arriba"
"Down"          = "cursor.abajo"
"Left"          = "cursor.izquierda"
"Right"         = "cursor.derecha"
"Home"          = "cursor.inicio_linea"
"End"           = "cursor.fin_linea"
"Ctrl+Home"     = "cursor.inicio_archivo"
"Ctrl+End"      = "cursor.fin_archivo"
# Selección de texto de toda la vida (PLAN.md §4) — extiende en vez de
# mover, sin colapsar lo ya seleccionado (a diferencia de la flecha
# sola). Selección hasta inicio/fin de archivo (Shift+Ctrl+Home/End)
# queda fuera de esta primera entrega.
"Shift+Up"      = "cursor.seleccionar_arriba"
"Shift+Down"    = "cursor.seleccionar_abajo"
"Shift+Left"    = "cursor.seleccionar_izquierda"
"Shift+Right"   = "cursor.seleccionar_derecha"
"Shift+Home"    = "cursor.seleccionar_inicio_linea"
"Shift+End"     = "cursor.seleccionar_fin_linea"
"Backspace"     = "editor.borrar_atras"
"Delete"        = "editor.borrar_adelante"
"Enter"         = "editor.nueva_linea"
"Tab"           = "editor.indentar_o_autocompletar"
# "Desindentar" todavía no hace nada fuera de la vista CSV (M3, PLAN.md
# §9), donde se reinterpreta como "celda anterior" — igual que `Tab` se
# reinterpreta ahí como "celda siguiente" en vez de indentar.
"Shift+Tab"     = "editor.desindentar"
"Ctrl+K Ctrl+L" = "config.recargar"
"Ctrl+K Ctrl+T" = "tema.seleccionar"
"Ctrl+K Ctrl+P" = "tema.editor_visual"
# Alternativa: mismo motivo que "Ctrl+K L"/"Ctrl+K T" más abajo — un
# segundo Ctrl en el chord puede no llegar en terminales clásicos.
"Ctrl+K P"      = "tema.editor_visual"
"Ctrl+,"        = "admin.abrir_panel"
# Alternativa: muchos terminales clásicos no le asignan ningún código de
# control a Ctrl+<símbolo> salvo un puñado de casos especiales (`Ctrl+\`,
# `Ctrl+[`, etc. — ver los comentarios de esos atajos más abajo); la coma
# no es uno de ellos, así que `Ctrl+,` puede llegar igual que una `,`
# suelta, sin modificador. `Ctrl+K A` ("Admin") no depende de eso.
"Ctrl+K A"      = "admin.abrir_panel"
"Ctrl+B"        = "panel.alternar_lateral"
# "Salto rápido": muestra una etiqueta de una tecla junto a cada archivo
# visible del explorador (lo abre/expande sin navegar con las flechas) —
# funciona sin importar dónde esté el foco: si el explorador está oculto,
# lo muestra y le da el foco antes de activar el modo.
"Ctrl+K J"      = "explorador.saltar"
# "R" de "Registro" (logs) — ver stderr de la sesión LSP activa, filtrable.
"Ctrl+K R"      = "lsp.ver_logs"
# Crear/renombrar/borrar en el explorador (BACKLOG.md P0, "explorador de
# solo lectura") — globales, mismo criterio que "explorador.saltar" más
# arriba: si el explorador está oculto, lo muestran y le dan el foco
# antes de abrir el prompt. "M" para renombrar no tiene mnemónico directo
# (la "R" obvia ya es de "Registro"/logs) — elegida por ser una tecla
# libre, no por significar algo. `Delete` para borrar reutiliza el mismo
# atajo global que ya usa el editor para "borrar hacia adelante"
# (`editor.borrar_adelante`) — no hace falta una entrada nueva acá: con
# el explorador enfocado se reinterpreta como pedir confirmación en vez
# de borrar directo (`procesar_comando`, no `ejecutar_comando_explorador`
# — necesita estado al que ese dispatcher no llega).
"Ctrl+K N"      = "explorador.nuevo_archivo"
"Ctrl+K C"      = "explorador.nueva_carpeta"
"Ctrl+K M"      = "explorador.renombrar"
"Esc"           = "explorador.enfocar_editor"
"Ctrl+Shift+P"  = "paleta.comandos"
# Alternativa universal: en terminales sin el protocolo de teclado
# extendido de Kitty, Ctrl+Shift+<letra> es indistinguible de Ctrl+<letra>
# (confirmado en tmux). F1 (como en VSCode) funciona en cualquier terminal.
"F1"            = "paleta.comandos"
"Ctrl+P"        = "buscar.archivos"
"Ctrl+Shift+O"  = "simbolos.ir_a"
"Ctrl+K ."      = "simbolos.ir_a"
'Ctrl+\'        = "panel.dividir_vertical"
'Ctrl+K Ctrl+\' = "panel.dividir_horizontal"
# Alternativas: en terminales clásicos Ctrl+\ suele decodificarse como
# otra combinación (confirmado en tmux: llega como Ctrl+4, el código de
# control 0x1C es compartido). Ctrl+K seguido del símbolo sin modificador
# no tiene esa ambigüedad.
"Ctrl+K \\"     = "panel.dividir_vertical"
"Ctrl+K -"      = "panel.dividir_horizontal"
"Ctrl+K F"      = "panel.cerrar"
"Ctrl+1"        = "panel.ir_a_1"
"Ctrl+2"        = "panel.ir_a_2"
"Ctrl+3"        = "panel.ir_a_3"
# Alternativas: Ctrl+<dígito> no tiene codificación de control estándar en
# absoluto en terminales clásicos (confirmado en tmux: Ctrl+1 llega igual
# que "1" solo, sin ningún modificador) — a diferencia de Ctrl+letra, que
# si tiene un byte de control dedicado.
"Ctrl+K 1"      = "panel.ir_a_1"
"Ctrl+K 2"      = "panel.ir_a_2"
"Ctrl+K 3"      = "panel.ir_a_3"
# Pestañas de archivos abiertos (BACKLOG.md P3 #10), por panel. Ctrl+W
# tiene código de control propio (anda en cualquier terminal).
# Ctrl+PageDown/Ctrl+PageUp llegan en xterm/tmux, pero algunas terminales
# (GNOME Terminal, Windows Terminal) se los quedan para sus propias
# pestañas: el chord con Ctrl+K y la tecla sola no depende de eso. Alt+N
# (ir a la pestaña N) funciona donde Alt/Option se manda como Meta — en
# macOS hay que activarlo en la terminal; si no, está en la paleta.
"Ctrl+PageDown"   = "pestana.siguiente"
"Ctrl+PageUp"     = "pestana.anterior"
"Ctrl+K PageDown" = "pestana.siguiente"
"Ctrl+K PageUp"   = "pestana.anterior"
"Ctrl+W"          = "pestana.cerrar"
"Alt+1"           = "pestana.ir_a_1"
"Alt+2"           = "pestana.ir_a_2"
"Alt+3"           = "pestana.ir_a_3"
"Alt+4"           = "pestana.ir_a_4"
"Alt+5"           = "pestana.ir_a_5"
"Alt+6"           = "pestana.ir_a_6"
"Alt+7"           = "pestana.ir_a_7"
"Alt+8"           = "pestana.ir_a_8"
"Alt+9"           = "pestana.ir_a_9"
# "Pantalla completa" en una terminal = maximizar el panel activo (como el
# zoom de tmux); la ventana y la letra las controla el emulador de
# terminal. Alternativa: F11 lo suele capturar el sistema (en macOS,
# "mostrar escritorio") o la terminal misma antes de que llegue.
"F11"           = "vista.pantalla_completa"
"Ctrl+K G"      = "vista.pantalla_completa"
"Ctrl+K Z"      = "vista.modo_zen"
"Ctrl+F"        = "buscar.en_archivo"
"Ctrl+H"        = "buscar.reemplazar"
# F3/Shift+F3 y Alt+R/C/W funcionan tanto con la barra abierta (capturados
# directo en el bucle de eventos, como la paleta de comandos) como con la
# barra cerrada, repitiendo la última búsqueda (estilo VSCode) — de ahí
# que también estén en el keymap global.
"F3"            = "buscar.siguiente"
"Shift+F3"      = "buscar.anterior"
"Alt+R"         = "buscar.alternar_regex"
"Alt+C"         = "buscar.alternar_mayusculas"
"Alt+W"         = "buscar.alternar_palabra"
"Ctrl+D"        = "cursor.seleccionar_siguiente_ocurrencia"
"Ctrl+Shift+L"  = "cursor.seleccionar_todas_ocurrencias"
# Alternativa: mismo problema de siempre con Ctrl+Shift+<letra> en
# terminales sin protocolo Kitty (confirmado repetidas veces en tmux a lo
# largo de este proyecto) — chord con Ctrl+K, sin esa ambigüedad.
"Ctrl+K L"      = "cursor.seleccionar_todas_ocurrencias"
# Portapapeles del sistema (BACKLOG.md P0 #15). Los tres tienen código de
# control propio y tcode corre en modo raw, así que llegan como teclas en
# cualquier terminal (Ctrl+C no se convierte en SIGINT). Ctrl+V además de
# lo que pegue la terminal por su lado (bracketed paste, Cmd+V en macOS o
# Ctrl+Shift+V en Linux): lee el portapapeles del sistema directamente, lo
# que sirve cuando la terminal no hace bracketed paste o dentro de tmux.
# Ctrl+Shift+V (vista Markdown) no choca: con protocolo Kitty llega
# distinto; sin él la terminal suele quedárselo para pegar.
"Ctrl+C"        = "editor.copiar"
"Ctrl+X"        = "editor.cortar"
"Ctrl+V"        = "editor.pegar"
"Ctrl+Alt+Up"   = "cursor.agregar_arriba"
"Ctrl+Alt+Down" = "cursor.agregar_abajo"

[editor]
# Plegado de bloques (PLAN.md §4, BACKLOG.md P2 #7).
"Ctrl+Shift+["  = "plegar.actual"
"Ctrl+Shift+]"  = "plegar.desplegar"
"Ctrl+K Ctrl+0" = "plegar.todo"
"Ctrl+K Ctrl+J" = "plegar.desplegar_todo"
# Alternativas: en terminales sin protocolo Kitty, Ctrl+Shift+[ llega
# como Ctrl+[ (el mismo byte que Esc) y Ctrl+0 no tiene código de control
# (llega como "0" suelto, igual que Ctrl+1/2/3 más arriba) — chord con
# Ctrl+K y el símbolo sin modificador, sin esa ambigüedad. Ctrl+J sí
# tiene código de control propio, así que "Ctrl+K Ctrl+J" ya anda en
# cualquier terminal y no necesita alternativa.
"Ctrl+K ["      = "plegar.actual"
"Ctrl+K ]"      = "plegar.desplegar"
"Ctrl+K 0"      = "plegar.todo"
# Navegación y edición con LSP (BACKLOG.md P1 #17): solo hacen algo si la
# sesión LSP del archivo activo anuncia la capacidad (si no, un aviso en
# la barra de estado). F12/Shift+F12/F2 como en VSCode; F2 en la vista de
# tabla CSV sigue editando la celda (se reinterpreta ahí). Ctrl+Espacio
# llega en casi cualquier terminal (código de control NUL), pero algunas
# (y macOS, que lo usa para cambiar de idioma) se lo quedan: el chord con
# Ctrl+K no depende de eso. Alt+Left llega en xterm/tmux; en macOS la
# terminal tiene que mandar Option como Meta.
"F12"            = "lsp.ir_a_definicion"
"Ctrl+K D"       = "lsp.ir_a_definicion"
"Alt+Left"       = "lsp.volver"
"Ctrl+K B"       = "lsp.volver"
"Shift+F12"      = "lsp.referencias"
"Ctrl+K U"       = "lsp.referencias"
"Ctrl+K I"       = "lsp.hover"
"Ctrl+Space"     = "lsp.completar"
"Ctrl+K Space"   = "lsp.completar"
"F2"             = "lsp.renombrar"
"Ctrl+K Shift+R" = "lsp.renombrar"

[markdown]
# Ctrl+Shift+V no está en [global] a propósito: es Ctrl+V con Shift, una
# combinación con la que muchos emuladores de terminal (y el propio
# usuario, por costumbre) esperan "pegar" — mantenerla agrupada aquí dejar
# claro que solo aplica con un archivo Markdown activo (el comando mismo
# no hace nada si no lo es, ver `markdown.preview_solo` en `app/main.rs`).
"Ctrl+K V"      = "markdown.alternar_preview"
"Ctrl+Shift+V"  = "markdown.preview_solo"

[csv]
"Ctrl+K T" = "csv.alternar_vista_tabla"
# F2 edita la celda: está en [editor] como "lsp.renombrar", que la vista
# de tabla reinterpreta (igual que Enter).
# Funciones de la tabla (BACKLOG.md P2 #9): solo hacen algo en la vista de
# tabla (en cualquier otro lado el comando no hace nada). Todas son chords
# con Ctrl+K: PLAN.md §9 pedía Ctrl+Shift+S/Ctrl+Shift+F, pero además de
# chocar con "Guardar como" y perder el Shift en terminales sin protocolo
# Kitty, una tecla simple no sirve — en un archivo normal escribiría texto.
# Ordenar alterna ascendente/descendente sobre la columna seleccionada;
# filtrar abre un prompt de una línea (Esc con la tabla enfocada, o Enter
# con el prompt vacío, quita el filtro). Las flechas del chord insertan en
# esa dirección; E/Shift+E eliminan fila/columna; Shift+→/Shift+← ajustan
# el ancho de la columna (solo de vista) y W lo devuelve al automático.
"Ctrl+K O"           = "csv.ordenar"
"Ctrl+K /"           = "csv.filtrar"
"Ctrl+K Down"        = "csv.insertar_fila_debajo"
"Ctrl+K Up"          = "csv.insertar_fila_arriba"
"Ctrl+K Right"       = "csv.insertar_columna_derecha"
"Ctrl+K Left"        = "csv.insertar_columna_izquierda"
"Ctrl+K E"           = "csv.eliminar_fila"
"Ctrl+K Shift+E"     = "csv.eliminar_columna"
"Ctrl+K Shift+Right" = "csv.ensanchar_columna"
"Ctrl+K Shift+Left"  = "csv.angostar_columna"
"Ctrl+K W"           = "csv.restablecer_ancho"
